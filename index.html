<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>CyberSoft Junior - Quy chế & Nội quy Nhập học</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="Nội quy nhập học và Hướng dẫn thực hiện - CyberSoft Junior">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
    <style>
        :root {
            --theme-color: #f37021;
            /* Cam nhận diện CyberSoft */
            --primary-navy: #142850;
        }

        /* FONT CHỮ TO HƠN 15% & GIÃN DÒNG CHUẨN */
        body {
            font-size: 17px !important;
            line-height: 1.75 !important;
            color: #2c3e50;
        }

        .sidebar {
            font-size: 16px !important;
            background-color: #fafbfc;
        }

        .markdown-section {
            font-size: 17px !important;
            line-height: 1.75 !important;
            max-width: 950px;
            padding: 30px 25px 40px;
        }

        .markdown-section p,
        .markdown-section ul,
        .markdown-section ol {
            font-size: 17px !important;
            line-height: 1.75 !important;
        }

        .markdown-section h1 {
            font-size: 28px !important;
            color: var(--primary-navy);
        }

        .markdown-section h2 {
            font-size: 22px !important;
            color: var(--theme-color);
            margin-top: 35px !important;
        }

        .markdown-section h3 {
            font-size: 18px !important;
            color: var(--primary-navy);
        }

        /* Hộp Highlight */
        .highlight-box {
            background: #fff8f3;
            border-left: 5px solid #f37021;
            padding: 16px 20px;
            margin: 22px 0;
            border-radius: 4px;
        }

        /* Bảng biểu */
        table {
            display: table !important;
            width: 100%;
            border-collapse: collapse;
            font-size: 16px !important;
            margin: 20px 0;
        }

        th {
            background-color: #142850 !important;
            color: #ffffff !important;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div id="app">Đang tải tài liệu CyberSoft Junior...</div>
    <script>
        window.$docsify = {
            name: 'CyberSoft Junior Regulations',
            repo: '',
            loadSidebar: true,
            subMaxLevel: 2, /* CHỈ HIỆN 17 ĐIỀU CHÍNH TRÊN SIDEBAR TỰ ĐỘNG */
            auto2top: true,
            search: {
                placeholder: 'Tìm kiếm quy định...',
                noData: 'Không tìm thấy kết quả!',
                depth: 3
            },
            copyCode: {
                buttonText: 'Sao chép',
                errorText: 'Lỗi',
                successText: 'Đã chép'
            }
        }
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>

</html>
