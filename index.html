<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>CyberSoft Junior - Hệ Thống Quy Chế Đào Tạo & Quy Trình Nhập Học</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description"
        content="Hệ thống Văn bản Nội quy Nhập học và Quy trình Vận hành Tiêu chuẩn (SOP) - CyberSoft Junior">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

    <!-- Font Be Vietnam Pro & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Theme Docsify Vue -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

    <style>
        :root {
            /* Tông màu thương hiệu CyberSoft: Cam - Vàng - Nâu */
            --theme-color: #ea580c;
            --text-color-base: #292524;
            --sidebar-width: 300px;
        }

        body {
            font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-color-base);
            line-height: 1.75;
            background-color: #ffffff;
        }

        code,
        kbd,
        pre,
        samp {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Sidebar tông màu xám ấm / nâu nhạt */
        .sidebar {
            background-color: #fafaf9;
            border-right: 1px solid #e7e5e4;
        }

        .sidebar-nav strong {
            color: #9a3412;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .sidebar-nav ul li a:hover,
        .sidebar-nav ul li.active>a {
            color: #ea580c !important;
            border-right: 3px solid #ea580c;
            font-weight: 600;
        }

        /* Tiêu đề chính */
        .markdown-section h1 {
            font-size: 1.9rem;
            font-weight: 700;
            color: #7c2d12;
            border-bottom: 2px solid #fed7aa;
            padding-bottom: 0.5rem;
            margin-top: 1.5rem;
        }

        .markdown-section h2 {
            font-size: 1.45rem;
            font-weight: 600;
            color: #9a3412;
            margin-top: 2rem;
            border-bottom: 1px solid #ffedd5;
            padding-bottom: 0.3rem;
        }

        .markdown-section h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #44403c;
            margin-top: 1.5rem;
        }

        /* Khung trích dẫn tông vàng nâu */
        .markdown-section blockquote {
            background: #fffbeb;
            border-left: 4px solid #f59e0b;
            border-radius: 0 6px 6px 0;
            color: #78350f;
            padding: 12px 18px;
            margin: 1.5em 0;
        }

        .markdown-section blockquote p {
            font-weight: 500;
            margin: 0;
        }

        /* Hộp điểm nhấn 5 điểm cốt lõi */
        .highlight-box {
            background: #fff7ed;
            border: 1px solid #fdba74;
            border-left: 5px solid #ea580c;
            border-radius: 6px;
            padding: 16px 20px;
            margin: 1.5em 0;
        }

        .highlight-box h3 {
            color: #9a3412;
            margin-top: 0;
            font-size: 1.15rem;
        }

        .highlight-box ol {
            margin-bottom: 0;
            padding-left: 20px;
        }

        .highlight-box li {
            margin-bottom: 8px;
            color: #44403c;
        }

        /* Bảng biểu */
        .markdown-section table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5em 0;
            display: table !important;
            overflow-x: auto;
        }

        .markdown-section table th {
            background-color: #fef3c7;
            color: #78350f;
            font-weight: 600;
            border: 1px solid #fde68a;
            padding: 10px 14px;
        }

        .markdown-section table td {
            border: 1px solid #e7e5e4;
            padding: 10px 14px;
        }

        .markdown-section table tr:nth-child(2n) {
            background-color: #fafaf9;
        }

        /* Khung mã code */
        .markdown-section pre {
            background-color: #292524 !important;
            border-radius: 6px;
        }

        .markdown-section code {
            color: #c2410c;
            background: #f5f5f4;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .markdown-section pre code {
            color: #fafaf9;
            background: transparent;
            padding: 0;
        }
    </style>
</head>

<body>
    <div id="app">Đang tải tài liệu học vụ CyberSoft Junior...</div>
    <script>
        window.$docsify = {
            name: 'CyberSoft Junior Hub',
            repo: '',
            loadSidebar: true,
            subMaxLevel: 2,
            auto2top: true,
            search: {
                maxAge: 86400000,
                paths: 'auto',
                placeholder: 'Tìm kiếm điều khoản, SOP...',
                noData: 'Không tìm thấy kết quả phù hợp.',
                depth: 3
            },
            copyCode: {
                buttonText: 'Sao chép',
                errorText: 'Lỗi',
                successText: 'Đã sao chép'
            }
        }
    </script>
    <!-- Docsify Core & Plugins -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
</body>

</html>
