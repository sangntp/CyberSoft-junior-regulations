<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>CyberSoft Junior - Hệ Thống Nội Quy & Quy Trình Vận Hành Nhập Học</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description"
        content="Hệ thống Văn bản Nội quy Nhập học và Quy trình Vận hành Tiêu chuẩn (SOP) - CyberSoft Junior">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

    <!-- Font chữ hiện đại Be Vietnam Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Theme Docsify Vue -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

    <style>
        :root {
            --theme-color: #0284c7;
            --text-color-base: #1e293b;
            --sidebar-width: 300px;
        }

        body {
            font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-color-base);
            line-height: 1.7;
        }

        code,
        kbd,
        pre,
        samp {
            font-family: 'JetBrains Mono', monospace;
        }

        .sidebar {
            background-color: #f8fafc;
            border-right: 1px solid #e2e8f0;
        }

        .sidebar-nav strong {
            color: #0369a1;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .markdown-section h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
        }

        .markdown-section h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #0369a1;
            margin-top: 2rem;
        }

        .markdown-section h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #334155;
        }

        .markdown-section blockquote {
            background: #f0f9ff;
            border-left: 4px solid #0284c7;
            border-radius: 0 8px 8px 0;
            color: #0c4a6e;
            padding: 12px 18px;
            margin: 1.5em 0;
        }

        .markdown-section table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5em 0;
            display: table !important;
            overflow-x: auto;
        }

        .markdown-section table th {
            background-color: #f1f5f9;
            color: #0f172a;
            font-weight: 600;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
        }

        .markdown-section table td {
            border: 1px solid #e2e8f0;
            padding: 10px 14px;
        }

        .markdown-section table tr:nth-child(2n) {
            background-color: #f8fafc;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 4px;
            margin-right: 4px;
        }

        .badge-blue {
            background: #e0f2fe;
            color: #0369a1;
        }

        .badge-green {
            background: #dcfce7;
            color: #15803d;
        }

        .badge-amber {
            background: #fef3c7;
            color: #b45309;
        }
    </style>
</head>

<body>
    <div id="app">Đang tải tài liệu học vụ CyberSoft Junior...</div>
    <script>
        window.$docsify = {
            name: 'CyberSoft Junior Hub',
            repo: '',
            loadSidebar: true,
            subMaxLevel: 3,
            auto2top: true,
            search: {
                maxAge: 86400000,
                paths: 'auto',
                placeholder: 'Tìm kiếm quy chế, SOP, trạng thái...',
                noData: 'Không tìm thấy kết quả phù hợp!',
                depth: 4
            },
            copyCode: {
                buttonText: 'Sao chép',
                errorText: 'Lỗi',
                successText: 'Đã chép'
            }
        }
    </script>
    <!-- Docsify Core & Plugins -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
</body>

</html>
